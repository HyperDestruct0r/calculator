<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <meta name="description" content="A TI-84-inspired graphing calculator: 2nd-key keypad, multi-function graphing, tables, history and memory. Works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Graphing Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app" data-mode="calc">
    <nav class="modes" id="modes" aria-label="Calculator modes">
      <button type="button" data-mode="calc" class="active" title="Alt+1">CALC</button>
      <button type="button" data-mode="graph" title="Alt+2">GRAPH</button>
      <button type="button" data-mode="table" title="Alt+3">TABLE</button>
      <button type="button" data-mode="history" title="Alt+4">HISTORY</button>
      <button type="button" data-mode="settings" title="Alt+5">SETTINGS</button>
    </nav>

    <div class="status" id="status" role="status">
      <span class="chip chip-2nd" id="chip2nd">2nd</span>
      <button type="button" class="chip btn" id="angleBtn" title="Toggle radians / degrees">RAD</button>
      <button type="button" class="chip btn" id="fracBtn" title="Toggle fraction / decimal results">FRAC</button>
      <span class="chip chip-mem" id="chipMem" hidden>M</span>
      <span class="toast" id="toast" aria-live="polite"></span>
      <button type="button" class="chip btn icon" id="helpBtn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
      <button type="button" class="chip btn icon" id="themeBtn" title="Toggle dark / light" aria-label="Toggle theme">◐</button>
    </div>

    <main class="screen" id="screen">
      <noscript><p style="padding:16px">This calculator needs JavaScript.</p></noscript>
    </main>

    <section class="keypad" id="keypad" aria-label="Calculator keypad"></section>

    <div class="overlay" id="overlay" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
